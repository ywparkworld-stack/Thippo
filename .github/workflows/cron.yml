name: Cron

# 定期実行（SPEC §11・付録 D30・D38）。利用者サイト（apps/guest）の /api/cron/* を呼ぶ。
# Vercel の Hobby プランでは1日1回より多い Cron を登録できないため、GitHub Actions のスケジュールで呼ぶ。
# 必要な Secrets: CRON_BASE_URL（利用者サイトの本番の URL。例 https://thippo.example）, CRON_SECRET（Vercel と同じ値）
# 注意：スケジュールは既定のブランチでだけ動く。混んでいると数分遅れることがある。
on:
  schedule:
    - cron: "*/5 * * * *" # expire-orders
    - cron: "*/15 * * * *" # complete-bookings, reminders-two-hours
    - cron: "0 9 * * *" # reminders-day-before（毎日 18:00 JST）
    - cron: "7 * * * *" # stripe-fees（毎時）
    - cron: "10 * 1 * *" # monthly-statements（毎月1日 9:10 JST から毎時。途中で終わった分を続けて発行する）
    - cron: "30 18 * * *" # cleanup（毎日 3:30 JST）
  workflow_dispatch:
    inputs:
      job:
        description: 実行する処理
        required: true
        type: choice
        options:
          - expire-orders
          - complete-bookings
          - reminders-two-hours
          - reminders-day-before
          - stripe-fees
          - monthly-statements
          - cleanup

# 同じスケジュールの実行が重ならないようにする（処理はどれも2回実行しても結果が変わらない）
concurrency:
  group: cron-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 呼ぶ処理を決める
        id: jobs
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ github.event.inputs.job }}
        run: |
          case "$SCHEDULE" in
            "*/5 * * * *") jobs="expire-orders" ;;
            "*/15 * * * *") jobs="complete-bookings reminders-two-hours" ;;
            "0 9 * * *") jobs="reminders-day-before" ;;
            "7 * * * *") jobs="stripe-fees" ;;
            "10 * 1 * *") jobs="monthly-statements" ;;
            "30 18 * * *") jobs="cleanup" ;;
            "") jobs="$INPUT_JOB" ;;
            *) echo "::error::unknown schedule: $SCHEDULE"; exit 1 ;;
          esac
          echo "list=$jobs" >> "$GITHUB_OUTPUT"

      - name: 利用者サイトの /api/cron を呼ぶ
        env:
          CRON_BASE_URL: ${{ secrets.CRON_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOBS: ${{ steps.jobs.outputs.list }}
        run: |
          if [ -z "$CRON_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_BASE_URL または CRON_SECRET が設定されていないため、定期実行を行いません"
            exit 0
          fi
          failed=0
          for job in $JOBS; do
            echo "::group::$job"
            if ! curl --silent --show-error --fail-with-body --max-time 90 \
                --retry 2 --retry-delay 10 --retry-all-errors \
                -H "Authorization: Bearer $CRON_SECRET" \
                "${CRON_BASE_URL%/}/api/cron/$job"; then
              echo "::error::$job failed"
              failed=1
            fi
            echo
            echo "::endgroup::"
          done
          exit $failed
